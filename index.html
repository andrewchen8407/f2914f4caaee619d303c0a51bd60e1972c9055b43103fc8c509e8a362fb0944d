      "Register Product (Producer)",
      "Transfer to Distributor",
      "Distributor Receives",
      "Transfer to Warehouse",
      "Warehouse Receives",
      "Transfer to Retailer",
      "Retailer Receives",
      "Mark as Sold"
    ];

    async function initContract() {
      const provider = new ethers.providers.JsonRpcProvider("http://127.0.0.1:8545");
      const wallet = new ethers.Wallet("0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80", provider);
      contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, wallet);
      log("✅ Connected to local Hardhat network (no real fees)");
    }

    function log(msg) {
      const logEl = document.getElementById("log");
      logEl.innerHTML += msg + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function registerProduct() {
      if (!contract) await initContract();

      const name = document.getElementById("productName").value;
      const origin = document.getElementById("origin").value;
      const metadata = "ipfs://Qm" + Math.random().toString(36).substring(2, 15);

      try {
        log("⏳ Registering new product...");
        const tx = await contract.registerProduct(name, origin, metadata);
        await tx.wait();
        currentBatchId = 0;
        currentStep = 0;
        isCompleted = false;
        log(`✅ Product registered! Batch ID: ${currentBatchId}`);
        await refreshProductInfo();
        document.getElementById("currentStep").innerHTML = steps[0];
      } catch (e) {
        log("❌ Error: " + e.message);
      }
    }

    async function nextStep() {
      if (!contract || currentBatchId === null) {
        return alert("Please register a product first");
      }

      if (isCompleted) {
        return alert("This product's journey is complete.\nPlease register a new product to start a new supply chain.");
      }

      try {
        log(`\n--- Step ${currentStep + 1}: ${steps[currentStep]} ---`);

        if (currentStep === 0) {
          // Already done during registration
        } else if (currentStep === 1) {
          await contract.transferProduct(currentBatchId, "0x0000000000000000000000000000000000000002");
        } else if (currentStep === 2) {
          await contract.receiveProduct(currentBatchId);
        } else if (currentStep === 3) {
          await contract.transferProduct(currentBatchId, "0x0000000000000000000000000000000000000003");
        } else if (currentStep === 4) {
          await contract.receiveProduct(currentBatchId);
        } else if (currentStep === 5) {
          await contract.transferProduct(currentBatchId, "0x0000000000000000000000000000000000000004");
        } else if (currentStep === 6) {
          await contract.receiveProduct(currentBatchId);
        } else if (currentStep === 7) {
          await contract.markAsSold(currentBatchId);
          isCompleted = true;
          log("🎉 Product journey completed - marked as Sold!");
        }

        currentStep++;
        document.getElementById("currentStep").innerHTML = steps[currentStep] || "Completed";
        await refreshProductInfo();
      } catch (e) {
        log("❌ Error during step: " + e.message);
      }
    }

    async function refreshProductInfo() {
      try {
        const product = await contract.getProduct(currentBatchId);
        document.getElementById("productInfo").innerHTML = JSON.stringify(product, null, 2);
      } catch (e) {
        console.error(e);
      }
    }
  </script>
